[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bottrade-research"
version = "0.1.0"
description = "Laboratorio reproduzivel RF x Transformer e bot paper spot para criptoativos."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "BOT_TRADE research project" }]
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.14,<2",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
ml = [
  "joblib>=1.4,<2",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "onnxscript>=0.2,<1",
  "optuna>=4.1,<5",
  "scikit-learn>=1.6,<2",
  "skl2onnx>=1.18,<2",
  "torch>=2.6,<3",
  "xgboost>=3.2,<4",
  "onnxmltools>=1.13,<2",
]
explain = [
  "captum>=0.7,<1",
  "shap>=0.47,<1",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
cloud = [
  "google-cloud-storage>=3.0,<4",
]
runtime = [
  "google-cloud-storage>=3.0,<4",
  "onnxruntime>=1.20,<2",
  "plotly>=6,<7",
  "psycopg[binary]>=3.2,<4",
  "streamlit>=1.42,<2",
]
dashboard = [
  "plotly>=6,<7",
  "streamlit>=1.42,<2",
]
dev = [
  "mypy>=1.14,<2",
  "pandas-stubs>=2.2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]
[project.scripts]
bottrade = "bottrade.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bottrade"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: accesses public external services",
  "slow: computationally heavier model test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["reports/linkedin"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
packages = ["bottrade"]
