name: Paper Trading V5 (24/7 Hourly Engine)

on:
  workflow_dispatch: # Disparado pontualmente pelo cron-job.org ou manualmente

concurrency:
  group: paper-trading-v5
  cancel-in-progress: true

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependências do BOT_TRADE
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[ml]"

      - name: Executar Ciclo de Paper Trading V5 (Live Binance)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bottrade v5 paper-run --live

      - name: Salvar Estado do Ledger / Banco SQLite
        uses: actions/upload-artifact@v4
        with:
          name: bottrade-database
          path: data/bottrade.db
          retention-days: 30

      - name: Atualizar Dashboard e Auditoria no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/LIVE_DASHBOARD.md reports/DECISION_AUDIT.md reports/decisions.jsonl
          if ! git diff --staged --quiet; then
            git commit -m "chore(paper): atualizar dashboard e log de auditoria [skip ci]"
            for attempt in 1 2 3; do
              git push origin main && break
              echo "Aviso: Push concorrente detectado (tentativa $attempt), sincronizando..."
              git fetch origin main
              git rebase -X theirs origin/main || (git rebase --abort && git reset --soft origin/main && git commit -m "chore(paper): atualizar dashboard e log de auditoria [skip ci]")
              sleep 2
            done
          fi
