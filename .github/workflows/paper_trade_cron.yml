name: Paper Trading V5 (24/7 Hourly Engine)

on:
  schedule:
    # Executa no minuto 2 de cada hora UTC (logo após o fechamento do candle de 1h)
    - cron: '2 * * * *'
  workflow_dispatch: # Permite disparo manual pelo painel do GitHub Actions

concurrency:
  group: paper-trading-v5
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependências do BOT_TRADE
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[ml]"

      - name: Executar Ciclo de Paper Trading V5 (Live Binance)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bottrade v5 paper-run --live

      - name: Salvar Estado do Ledger / Banco SQLite
        uses: actions/upload-artifact@v4
        with:
          name: bottrade-database
          path: data/bottrade.db
          retention-days: 30

      - name: Atualizar Dashboard no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/LIVE_DASHBOARD.md data/bottrade.db
          git diff --staged --quiet || (git commit -m "chore(paper): atualizar live dashboard [skip ci]" && git push)
